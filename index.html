<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="Karteikarten und Grammatiktraining zum Wortschatz aus Momente A1–A2, Deutsch–Russisch.">
<meta name="theme-color" content="#EFEEEA">
<title>Momente Wortschatz — Deutsch/Русский</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Golos+Text:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
:root{
  --paper:#EFEEEA; --surface:#FFFFFF; --surface-2:#F6F5F2;
  --ink:#1A1C21; --ink-2:#5B5F69; --ink-3:#8A8E98;
  --line:#DBD9D3; --line-2:#C8C5BD;
  --der:#2C5AA0; --die:#AC3557; --das:#2F7358;
  --der-bg:#E4EBF6; --die-bg:#F7E4EA; --das-bg:#E0EEE7;
  --good:#2F7358; --bad:#AC3557; --warn:#9A6B15;
  --shadow:0 1px 2px rgba(26,28,33,.06), 0 8px 24px -12px rgba(26,28,33,.18);
  --shadow-lift:0 2px 4px rgba(26,28,33,.07), 0 18px 40px -16px rgba(26,28,33,.28);
  --sans:"Golos Text","Helvetica Neue",Arial,sans-serif;
  --disp:"Bricolage Grotesque","Golos Text",Arial,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#14161A; --surface:#1D2026; --surface-2:#23272E;
    --ink:#ECEBE7; --ink-2:#A3A8B2; --ink-3:#767B85;
    --line:#2E333B; --line-2:#3C424B;
    --der:#83AAE8; --die:#E88BA5; --das:#6DBE9C;
    --der-bg:#1E2A3C; --die-bg:#33202A; --das-bg:#1C2E28;
    --good:#6DBE9C; --bad:#E88BA5; --warn:#D2A44A;
    --shadow:0 1px 2px rgba(0,0,0,.4), 0 8px 24px -12px rgba(0,0,0,.6);
    --shadow-lift:0 2px 4px rgba(0,0,0,.45), 0 18px 40px -16px rgba(0,0,0,.7);
  }
}
:root[data-theme="dark"]{
  --paper:#14161A; --surface:#1D2026; --surface-2:#23272E;
  --ink:#ECEBE7; --ink-2:#A3A8B2; --ink-3:#767B85;
  --line:#2E333B; --line-2:#3C424B;
  --der:#83AAE8; --die:#E88BA5; --das:#6DBE9C;
  --der-bg:#1E2A3C; --die-bg:#33202A; --das-bg:#1C2E28;
  --good:#6DBE9C; --bad:#E88BA5; --warn:#D2A44A;
  --shadow:0 1px 2px rgba(0,0,0,.4), 0 8px 24px -12px rgba(0,0,0,.6);
  --shadow-lift:0 2px 4px rgba(0,0,0,.45), 0 18px 40px -16px rgba(0,0,0,.7);
}

*{box-sizing:border-box}
body{
  margin:0; background:var(--paper); color:var(--ink);
  font-family:var(--sans); font-size:15px; line-height:1.5;
  -webkit-font-smoothing:antialiased;
}
.wrap{max-width:860px; margin:0 auto; padding-inline:18px; padding-block:22px 64px;}

.mast{display:flex; align-items:flex-end; justify-content:space-between; gap:16px; flex-wrap:wrap; margin-bottom:18px;}
.mast h1{
  font-family:var(--disp); font-weight:800; font-size:clamp(26px,5.2vw,38px);
  line-height:1.02; margin:0; letter-spacing:-.022em; text-wrap:balance;
}
.mast h1 .sub{display:block; font-family:var(--mono); font-size:11px; font-weight:500;
  letter-spacing:.14em; text-transform:uppercase; color:var(--ink-3); margin-bottom:8px;}
.mast-right{display:flex; gap:8px; align-items:center;}

button{font:inherit; color:inherit; cursor:pointer; border:none; background:none;}
.btn{
  display:inline-flex; align-items:center; gap:7px;
  border:1px solid var(--line-2); background:var(--surface); color:var(--ink);
  border-radius:9px; padding:7px 12px; font-size:13px; font-weight:500;
  transition:background .12s, border-color .12s, transform .08s;
}
.btn:hover{background:var(--surface-2); border-color:var(--ink-3);}
.btn:active{transform:translateY(1px)}
.btn.icon{padding:7px 9px;}
:where(button,input,select,summary,a):focus-visible{outline:2px solid var(--ink); outline-offset:2px; border-radius:8px;}

.mono{font-family:var(--mono); font-variant-numeric:tabular-nums;}
.eyebrow{font-family:var(--mono); font-size:10.5px; font-weight:600; letter-spacing:.16em;
  text-transform:uppercase; color:var(--ink-3);}

.modes{display:flex; gap:4px; background:var(--surface); border:1px solid var(--line);
  border-radius:11px; padding:4px; overflow-x:auto; scrollbar-width:none;}
.modes::-webkit-scrollbar{display:none}
.modes button{
  flex:1 0 auto; white-space:nowrap; padding:8px 14px; border-radius:8px;
  font-size:13.5px; font-weight:600; color:var(--ink-2); transition:background .12s,color .12s;
}
.modes button:hover{color:var(--ink)}
.modes button[aria-selected="true"]{background:var(--ink); color:var(--paper);}

.deckbar{
  display:flex; align-items:center; justify-content:space-between; gap:12px; flex-wrap:wrap;
  margin-top:12px; padding:11px 14px; background:var(--surface); border:1px solid var(--line);
  border-radius:11px;
}
.deckstat{display:flex; gap:18px; flex-wrap:wrap; align-items:baseline;}
.deckstat div{display:flex; gap:6px; align-items:baseline;}
.deckstat b{font-family:var(--mono); font-size:15px; font-weight:600; font-variant-numeric:tabular-nums;}
.deckstat span{font-size:12px; color:var(--ink-2);}

.panel{margin-top:10px; border:1px solid var(--line); border-radius:12px;
  background:var(--surface); overflow:hidden;}
.panel[hidden]{display:none!important}
.panel section{padding:14px 15px; border-top:1px solid var(--line);}
.panel section:first-child{border-top:none}
.panel h3{margin:0 0 10px; font-family:var(--mono); font-size:10.5px; font-weight:600;
  letter-spacing:.16em; text-transform:uppercase; color:var(--ink-3);}
.chips{display:flex; flex-wrap:wrap; gap:6px;}
.chip{
  border:1px solid var(--line-2); background:var(--surface-2); border-radius:8px;
  padding:5px 10px; font-size:12.5px; font-weight:500; color:var(--ink-2);
  transition:background .1s,color .1s,border-color .1s;
}
.chip:hover{border-color:var(--ink-3); color:var(--ink);}
.chip[aria-pressed="true"]{background:var(--ink); border-color:var(--ink); color:var(--paper);}
.chip .n{font-family:var(--mono); font-size:10.5px; opacity:.6; margin-left:5px;}
.lessongrid{display:grid; grid-template-columns:repeat(auto-fill,minmax(86px,1fr)); gap:5px;}
.lessongrid .chip{display:flex; justify-content:space-between; align-items:baseline; padding:5px 8px;}
.lessongrid .chip .dt{font-family:var(--mono); font-size:11.5px;}
.quicklinks{display:flex; gap:12px; margin-bottom:9px; flex-wrap:wrap; align-items:baseline;}
.quicklinks button{font-size:12px; color:var(--ink-2); text-decoration:underline;
  text-underline-offset:3px; text-decoration-color:var(--line-2);}
.quicklinks button:hover{color:var(--ink);}

.stage{margin-top:18px;}
.card-outer{perspective:1400px;}
.card{
  position:relative; width:100%; min-height:300px; cursor:pointer;
  transform-style:preserve-3d; transition:transform .42s cubic-bezier(.4,.16,.2,1);
}
.card.flipped{transform:rotateY(180deg);}
.face{
  position:absolute; inset:0; backface-visibility:hidden; -webkit-backface-visibility:hidden;
  background:var(--surface); border:1px solid var(--line); border-radius:18px;
  box-shadow:var(--shadow); padding:26px 26px 22px;
  display:flex; flex-direction:column;
}
.card:hover .face{box-shadow:var(--shadow-lift);}
.face.back{transform:rotateY(180deg);}
.card-spacer{min-height:300px; visibility:hidden;}
.face-top{display:flex; justify-content:space-between; align-items:center; gap:10px; min-height:22px;}
.face-mid{flex:1; display:flex; flex-direction:column; justify-content:center; gap:12px;
  padding-block:16px;}
.face-bot{display:flex; justify-content:space-between; align-items:center; gap:10px; min-height:20px;}

.term{font-family:var(--disp); font-weight:700; letter-spacing:-.02em; line-height:1.1;
  font-size:clamp(26px,6.4vw,42px); text-wrap:balance; margin:0; overflow-wrap:anywhere;}
.term.small{font-size:clamp(19px,4.2vw,28px); line-height:1.24;}
.term .art{color:var(--gcol,var(--ink-2));}
.trans{font-size:clamp(17px,3.4vw,23px); font-weight:500; line-height:1.34; text-wrap:balance; margin:0; overflow-wrap:anywhere;}
.gram{display:flex; flex-wrap:wrap; gap:6px;}
.gtag{
  font-family:var(--mono); font-size:11px; font-weight:500; padding:3px 8px; border-radius:6px;
  background:var(--surface-2); color:var(--ink-2); border:1px solid var(--line); white-space:nowrap;
}
.gtag.g{background:var(--gbg); color:var(--gcol); border-color:transparent; font-weight:600;}
.ex{border-top:1px dashed var(--line-2); padding-top:12px; display:flex; flex-direction:column; gap:10px;}
.ex-item{display:grid; gap:2px;}
.ex-de{font-family:var(--disp); font-weight:500; font-size:15px; line-height:1.35;}
.ex-ru{font-size:13.5px; color:var(--ink-2); line-height:1.35;}
.hint{font-size:12px; color:var(--ink-3);}
kbd{font-family:var(--mono); font-size:10.5px; border:1px solid var(--line-2);
  border-bottom-width:2px; border-radius:5px; padding:1px 5px; color:var(--ink-2); background:var(--surface-2);}

.star{font-size:17px; line-height:1; color:var(--ink-3); padding:3px 5px;}
.star[aria-pressed="true"]{color:var(--warn);}

.rate{display:grid; grid-template-columns:repeat(3,1fr); gap:8px; margin-top:12px;}
.rate button{
  border:1px solid var(--line-2); background:var(--surface); border-radius:11px;
  padding:12px 8px 10px; display:grid; gap:2px; justify-items:center; transition:.12s;
}
.rate button:hover{border-color:var(--ink-3);}
.rate .lab{font-size:13.5px; font-weight:600;}
.rate .sub{font-family:var(--mono); font-size:10.5px; color:var(--ink-3);}
.rate .again{color:var(--bad)} .rate .hard{color:var(--warn)} .rate .good{color:var(--good)}
.showbtn{width:100%; margin-top:12px; justify-content:center; padding:13px; font-size:14px;
  font-weight:600; background:var(--ink); color:var(--paper); border:1px solid var(--ink); border-radius:11px;}
.showbtn:hover{background:var(--ink); color:var(--paper); opacity:.88; border-color:var(--ink);}

.opts{display:grid; gap:8px; margin-top:12px;}
.opt{
  text-align:left; border:1px solid var(--line-2); background:var(--surface); border-radius:11px;
  padding:13px 15px; font-size:15px; line-height:1.35; transition:.12s; width:100%; color:var(--ink);
}
.opt:hover:not(:disabled){border-color:var(--ink-3); background:var(--surface-2);}
.opt:disabled{cursor:default}
.opt.correct{border-color:var(--good); background:var(--das-bg); color:var(--das);}
.opt.wrong{border-color:var(--bad); background:var(--die-bg); color:var(--die);}
.artopts{display:grid; grid-template-columns:repeat(3,1fr); gap:8px; margin-top:12px;}
.artopts .opt{text-align:center; font-family:var(--disp); font-weight:700; font-size:20px; padding:16px 8px;}
.artopts .opt[data-a="der"]{color:var(--der)} .artopts .opt[data-a="die"]{color:var(--die)} .artopts .opt[data-a="das"]{color:var(--das)}
.artopts .opt.dim{opacity:.32}

.typerow{display:flex; gap:8px; margin-top:12px;}
.typerow input{
  flex:1; min-width:0; font:600 17px/1.3 var(--disp); padding:13px 15px; color:var(--ink);
  background:var(--surface); border:1px solid var(--line-2); border-radius:11px;
}
.typerow input.ok{border-color:var(--good); background:var(--das-bg);}
.typerow input.no{border-color:var(--bad); background:var(--die-bg);}
.umlauts{display:flex; gap:5px; margin-top:8px; flex-wrap:wrap;}
.umlauts button{font-family:var(--disp); font-weight:600; font-size:14px; width:34px; height:30px;
  border:1px solid var(--line); background:var(--surface-2); border-radius:7px; color:var(--ink-2);}
.umlauts button:hover{color:var(--ink); border-color:var(--ink-3);}
.verdict{margin-top:12px; margin-bottom:12px; font-size:15px; display:flex; gap:10px; align-items:baseline; flex-wrap:wrap;}
.verdict .yes{color:var(--good); font-weight:600;}
.verdict .no{color:var(--bad); font-weight:600;}
.verdict .ans{font-family:var(--disp); font-weight:700; font-size:19px;}

.prog{margin-top:22px; display:grid; gap:9px;}
.bar{display:flex; height:9px; border-radius:99px; overflow:hidden; background:var(--surface-2);
  border:1px solid var(--line);}
.bar i{display:block; height:100%;}
.legend{display:flex; gap:14px; flex-wrap:wrap; font-size:11.5px; color:var(--ink-2);}
.legend span{display:flex; align-items:center; gap:5px;}
.dot{width:8px; height:8px; border-radius:2px; display:inline-block;}
.legend b{font-family:var(--mono); font-weight:600; color:var(--ink); font-variant-numeric:tabular-nums;}

.search{width:100%; font:inherit; font-size:14px; padding:11px 14px; color:var(--ink);
  background:var(--surface); border:1px solid var(--line-2); border-radius:11px; margin-bottom:10px;}
.list{border:1px solid var(--line); border-radius:12px; background:var(--surface); overflow:hidden;}
.row{display:grid; grid-template-columns:minmax(0,1.05fr) minmax(0,1fr) auto; gap:14px; align-items:baseline;
  padding:11px 14px; border-top:1px solid var(--line);}
.row:first-child{border-top:none}
.row .de{font-family:var(--disp); font-weight:600; font-size:15.5px; line-height:1.3; min-width:0; overflow-wrap:anywhere;}
.row .ru{font-size:13.5px; color:var(--ink-2); line-height:1.35; min-width:0; overflow-wrap:anywhere;}
.row .tag{font-family:var(--mono); font-size:10.5px; color:var(--ink-3); white-space:nowrap;}
.list.hidden .ru{filter:blur(4.5px); opacity:.55; transition:.15s;}
.list.hidden .row:hover .ru{filter:none; opacity:1;}
.more{padding:13px; text-align:center; font-size:13px; color:var(--ink-2); border-top:1px solid var(--line); width:100%;}
.more:hover{background:var(--surface-2); color:var(--ink);}

/* ---------- Grammatik ---------- */
.subnav{display:flex; gap:5px; margin-bottom:14px; overflow-x:auto; scrollbar-width:none; padding-bottom:2px;}
.subnav::-webkit-scrollbar{display:none}
.subnav button{
  flex:0 0 auto; white-space:nowrap; border:1px solid var(--line-2); background:var(--surface);
  border-radius:99px; padding:6px 13px; font-size:12.5px; font-weight:600; color:var(--ink-2);
}
.subnav button:hover{color:var(--ink); border-color:var(--ink-3);}
.subnav button[aria-selected="true"]{background:var(--ink); border-color:var(--ink); color:var(--paper);}
.gprompt{display:flex; flex-direction:column; gap:10px; padding-block:6px;}
.gsent{font-family:var(--disp); font-weight:600; font-size:clamp(19px,3.8vw,25px); line-height:1.34;
  text-wrap:balance; margin:0;}
.gsent .gap{
  display:inline-block; min-width:5.5ch; border-bottom:2px solid var(--ink-3);
  margin-inline:3px; color:var(--ink-3); text-align:center; vertical-align:baseline;
}
.gsent .gap.filled{border-bottom-color:currentColor;}
.gsent .ok{color:var(--good)} .gsent .bad{color:var(--bad)}
.gru{font-size:14px; color:var(--ink-2); line-height:1.4; margin:0;}
.steps{display:grid; gap:8px; margin-top:12px;}
.steprow{display:flex; gap:8px; align-items:center; flex-wrap:wrap;}
.steprow .lbl{font-family:var(--mono); font-size:10.5px; letter-spacing:.14em; text-transform:uppercase;
  color:var(--ink-3); flex:0 0 auto; min-width:6.5em;}
.pill{
  border:1px solid var(--line-2); background:var(--surface); border-radius:99px;
  padding:9px 16px; font-family:var(--disp); font-weight:700; font-size:15px; color:var(--ink);
}
.pill:hover:not(:disabled){border-color:var(--ink-3); background:var(--surface-2);}
.pill:disabled{cursor:default}
.pill.correct{border-color:var(--good); background:var(--das-bg); color:var(--das);}
.pill.wrong{border-color:var(--bad); background:var(--die-bg); color:var(--die);}
.pill.dim{opacity:.32}
.pill.chosen{border-color:var(--ink); background:var(--ink); color:var(--paper);}
.why{
  margin-top:12px; padding:11px 13px; border-radius:10px; background:var(--surface-2);
  border:1px solid var(--line); font-size:13.5px; line-height:1.45; color:var(--ink-2);
  display:flex; flex-direction:column; gap:5px;
}
.why b{color:var(--ink); font-weight:600;}
.why .rule{font-family:var(--mono); font-size:11.5px; color:var(--ink-3);}
.gscore{display:flex; gap:14px; align-items:baseline; font-size:12px; color:var(--ink-2);}
.gscore b{font-family:var(--mono); font-size:14px; color:var(--ink); font-variant-numeric:tabular-nums;}

.empty{padding:44px 20px; text-align:center; color:var(--ink-2); background:var(--surface);
  border:1px dashed var(--line-2); border-radius:14px;}
.empty b{display:block; font-family:var(--disp); font-size:19px; color:var(--ink); margin-bottom:6px;}
.sync{font-family:var(--mono); font-size:10px; letter-spacing:.1em; text-transform:uppercase; color:var(--ink-3);}

@media (max-width:560px){
  .rate button{padding:11px 6px;}
  .rate .lab{font-size:12.5px}
  .row{grid-template-columns:1fr; gap:3px;}
  .row .tag{grid-row:1; justify-self:end; margin-top:-2px;}
  .face{padding:20px 18px 18px;}
}
@media (prefers-reduced-motion: reduce){
  *{transition-duration:.01ms!important; animation-duration:.01ms!important;}
}
</style>
</head>
<body>


<div class="wrap">
  <header class="mast">
    <h1><span class="sub">Momente A1–A2 · Wortschatz</span>Deutsch&nbsp;→&nbsp;Русский</h1>
    <div class="mast-right">
      <span class="sync" title="Fortschritt bleibt in diesem Browser.">lokal gespeichert</span>
      <button class="btn icon" id="themeBtn" title="Theme wechseln" aria-label="Theme wechseln">◐</button>
      <button class="btn" id="filterBtn" aria-expanded="false">Deck</button>
    </div>
  </header>

  <div class="modes" role="tablist" id="modes">
    <button role="tab" data-mode="cards" aria-selected="true">Karten</button>
    <button role="tab" data-mode="choice" aria-selected="false">Auswahl</button>
    <button role="tab" data-mode="artikel" aria-selected="false">der·die·das</button>
    <button role="tab" data-mode="type" aria-selected="false">Tippen</button>
    <button role="tab" data-mode="gram" aria-selected="false">Grammatik</button>
    <button role="tab" data-mode="browse" aria-selected="false">Liste</button>
  </div>

  <div class="panel" id="panel" hidden>
    <section>
      <h3>Richtung</h3>
      <div class="chips" id="dirChips">
        <button class="chip" data-dir="de" aria-pressed="true">Deutsch → Русский</button>
        <button class="chip" data-dir="ru" aria-pressed="false">Русский → Deutsch</button>
        <button class="chip" data-dir="mix" aria-pressed="false">Gemischt</button>
      </div>
    </section>
    <section>
      <h3>Wortart</h3>
      <div class="chips" id="posChips"></div>
    </section>
    <section>
      <h3>Auswahl</h3>
      <div class="chips" id="flagChips">
        <button class="chip" data-flag="due" aria-pressed="false">Nur fällige</button>
        <button class="chip" data-flag="star" aria-pressed="false">Nur markierte ★</button>
        <button class="chip" data-flag="new" aria-pressed="false">Nur neue</button>
      </div>
    </section>
    <section>
      <h3>Lektionen</h3>
      <div class="quicklinks">
        <button data-pick="all">Alle</button>
        <button data-pick="last5">Letzte 5</button>
        <button data-pick="last1">Letzte</button>
        <button data-pick="none">Keine</button>
        <button data-pick="invert">Umkehren</button>
      </div>
      <div class="lessongrid" id="lessonGrid"></div>
    </section>
    <section>
      <h3>Fortschritt</h3>
      <p class="hint" id="syncNote" style="margin:0 0 9px">Der Fortschritt liegt in diesem Browser. Zum Gerätewechsel exportieren und drüben einlesen.</p>
      <div class="quicklinks" style="margin:0">
        <button id="exportBtn">Exportieren</button>
        <button id="importBtn">Importieren</button>
        <button id="resetBtn">Zurücksetzen</button>
      </div>
      <div id="xfer" hidden>
        <textarea id="xferBox" class="search" rows="3" spellcheck="false"
          style="margin-top:10px;margin-bottom:8px;font-family:var(--mono);font-size:11px;resize:vertical"
          aria-label="Fortschrittsdaten"></textarea>
        <div class="quicklinks" style="margin:0">
          <button id="xferApply">Einlesen</button>
          <button id="xferClose">Schließen</button>
          <span class="hint" id="xferMsg"></span>
        </div>
      </div>
    </section>
  </div>

  <div class="deckbar">
    <div class="deckstat">

<script>
(function(){
"use strict";
const $ = (s,r)=> (r||document).querySelector(s);
const $$ = (s,r)=> Array.from((r||document).querySelectorAll(s));
const LS = "momente.wortschatz.v1";
const DAY = 86400000;
const INTERVALS = [0, 1, 3, 7, 21];
const BOXCOL = ["#8A8E98","#AC3557","#9A6B15","#2C5AA0","#2F7358"];
const BOXNAME = ["neu","Box 1","Box 2","Box 3","gelernt"];
const POSNAME = {noun:"Nomen", verb:"Verben", phrase:"Wendungen", sentence:"Sätze", other:"Sonstige"};

const defaults = {
  mode:"cards", gsub:"perfekt", dir:"de", pos:{}, flags:{due:false,star:false,new:false},
  lessons:null, prog:{}, star:{}, day:null, todayCount:0, theme:null, updated:0
};
let S = load();
function load(){
  let s = Object.assign({}, defaults);
  try{ const raw = localStorage.getItem(LS); if(raw) s = Object.assign(s, JSON.parse(raw)); }catch(e){}
  if(!s.prog) s.prog = {}; if(!s.star) s.star = {}; if(!s.flags) s.flags = {};
  const today = new Date().toISOString().slice(0,10);
  if(s.day !== today){ s.day = today; s.todayCount = 0; }
  return s;
}
let saveT = null;
function save(){
  try{ localStorage.setItem(LS, JSON.stringify(S)); }catch(e){}
}

function applyTheme(){
  if(S.theme) document.documentElement.setAttribute("data-theme", S.theme);
  else document.documentElement.removeAttribute("data-theme");
}
applyTheme();
$("#themeBtn").addEventListener("click", ()=>{
  const cur2 = S.theme || (matchMedia("(prefers-color-scheme: dark)").matches ? "dark":"light");
  S.theme = cur2 === "dark" ? "light" : "dark"; applyTheme(); save();
});

const LESSONS = [];
DATA.forEach(c=>{ let L = LESSONS.find(x=>x.n===c.l); if(!L){ L={n:c.l, date:c.t, count:0}; LESSONS.push(L);} L.count++; });
LESSONS.sort((a,b)=>a.n-b.n);
const POSLIST = [];
DATA.forEach(c=>{ let p = POSLIST.find(x=>x.k===c.p); if(!p){ p={k:c.p,count:0}; POSLIST.push(p);} p.count++; });
POSLIST.sort((a,b)=>b.count-a.count);
if(!S.lessons) S.lessons = LESSONS.map(l=>l.n);
if(!S.pos || !Object.keys(S.pos).length){ S.pos = {}; POSLIST.forEach(p=> S.pos[p.k]=true); }

const deDate = t => { const p = t.split("-"); return p[2]+"."+p[1]+"."; };
function P(id){ return S.prog[id] || {b:0, due:0, seen:0}; }
function isDue(id){ const p = S.prog[id]; return !p || (p.due||0) <= Date.now(); }

function deck(){
  return DATA.filter(c=>{
    if(!S.lessons.includes(c.l)) return false;
    if(!S.pos[c.p]) return false;
    if(S.flags.star && !S.star[c.i]) return false;
    if(S.flags.new && S.prog[c.i]) return false;
    if(S.flags.due && !isDue(c.i)) return false;
    return true;
  });
}

let queue = [], qi = 0, flipped = false;
function buildQueue(){
  const d = deck(), now = Date.now();
  const due = [], fresh = [], later = [];
  d.forEach(c=>{ const p = S.prog[c.i];
    if(!p) fresh.push(c); else if((p.due||0) <= now) due.push(c); else later.push(c); });
  shuffle(due); shuffle(fresh); shuffle(later);
  queue = due.concat(fresh, later);
  qi = 0; flipped = false;
}
function shuffle(a){ for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); const t=a[i]; a[i]=a[j]; a[j]=t; } }
function cur(){ return queue[qi]; }
function next(){ qi++; if(qi >= queue.length) buildQueue(); flipped=false; render(); renderProgress(); }

function grade(id, g){
  const p = Object.assign({b:0,due:0,seen:0}, S.prog[id]);
  if(g===0) p.b = 0; else if(g===1) p.b = Math.max(0, p.b - 1); else p.b = Math.min(4, p.b + 1);
  p.seen = (p.seen||0) + 1;
  p.due = Date.now() + INTERVALS[p.b]*DAY;
  S.prog[id] = p;
  S.todayCount = (S.todayCount||0) + 1;
  save();
}

const GEN = {der:["--der","--der-bg"], die:["--die","--die-bg"], das:["--das","--das-bg"]};
function genStyle(g){ return g ? "--gcol:var("+GEN[g][0]+");--gbg:var("+GEN[g][1]+")" : ""; }
function esc(s){ return String(s).replace(/[&<>"]/g, m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[m])); }
function termHTML(c){
  const m = c.d.match(/^(der|die|das)\s+([\s\S]+)$/);
  return m ? '<span class="art">'+m[1]+'</span> '+esc(m[2]) : esc(c.d);
}
function gramTags(c){
  const t = [];
  if(c.g) t.push('<span class="gtag g">'+c.g+'</span>');
  if(c.n) t.push('<span class="gtag">Pl. '+esc(c.n)+'</span>');
  if(c.v) t.push('<span class="gtag">'+esc(c.v)+'</span>');
  t.push('<span class="gtag">L'+c.l+' · '+deDate(c.t)+'</span>');
  if(S.prog[c.i]) t.push('<span class="gtag">'+BOXNAME[P(c.i).b]+'</span>');
  return '<div class="gram">'+t.join("")+'</div>';
}
function exHTML(c){
  if(!c.e || !c.e.length) return "";
  return '<div class="ex">'+c.e.map(e=>'<div class="ex-item"><div class="ex-de">'+esc(e[0])+'</div>'+
    (e[1]?'<div class="ex-ru">'+esc(e[1])+'</div>':"")+'</div>').join("")+'</div>';
}
function dirFor(c){ return S.dir === "mix" ? (c.i % 2 ? "ru" : "de") : S.dir; }
function bareDe(c){ return c.d.replace(/^(der|die|das)\s+/,"").replace(/,\s*[-–—]?[\wÄÖÜäöüß]*$/,"").trim(); }

const stage = $("#stage");
function render(){
  if(S.mode === "browse"){ renderBrowse(); return; }
  if(S.mode === "gram"){ renderGram(); return; }
  if(S.mode === "artikel"){ renderArtikel(); return; }
  const c = cur();
  if(!c){ stage.innerHTML = '<div class="empty"><b>Kein Wort im Deck</b>Erweitere die Auswahl über „Deck“ oben rechts.</div>'; return; }
  if(S.mode === "cards") renderCards(c);
  else if(S.mode === "choice") renderChoice(c);
  else if(S.mode === "type") renderType(c);
}

function inDays(n){ return n===0 ? "heute" : (n===1 ? "1 Tag" : n+" Tage"); }
function sizeCard(){
  requestAnimationFrame(()=>{
    const card = $("#card"); if(!card) return;
    const f = $(".face.front", card), b = $(".face.back", card);
    const h = Math.max(f.scrollHeight, b.scrollHeight, 300);
    card.style.minHeight = h+"px";
    const sp = $(".card-spacer"); if(sp) sp.style.minHeight = h+"px";
  });
}
function renderCards(c){
  const dir = dirFor(c);
  const frontTxt = dir === "de" ? termHTML(c) : esc(c.r);
  const frontRaw = dir === "de" ? c.d : c.r;
  const starOn = !!S.star[c.i];
  stage.innerHTML =
  '<div class="card-outer">'+
    '<div class="card '+(flipped?"flipped":"")+'" id="card" role="button" tabindex="0" aria-label="Karte umdrehen" style="'+genStyle(c.g)+'">'+
      '<div class="face front">'+
        '<div class="face-top"><span class="eyebrow">'+(dir==="de"?"Deutsch":"Русский")+'</span>'+
          '<div style="display:flex;gap:6px;align-items:center">'+
            '<button class="star" id="starBtn" aria-pressed="'+starOn+'" title="Markieren (S)">'+(starOn?"★":"☆")+'</button>'+
          '</div></div>'+
        '<div class="face-mid"><p class="term '+(frontRaw.length>26?"small":"")+'">'+frontTxt+'</p>'+(dir==="de"?gramTags(c):"")+'</div>'+
        '<div class="face-bot"><span class="hint">Tippen oder <kbd>Space</kbd> zum Umdrehen</span><span class="mono hint">'+(qi+1)+'/'+queue.length+'</span></div>'+
      '</div>'+
      '<div class="face back">'+
        '<div class="face-top"><span class="eyebrow">'+(dir==="de"?"Русский":"Deutsch")+'</span>'+
          '</div>'+
        '<div class="face-mid">'+
          (dir==="de"
            ? '<p class="trans">'+esc(c.r)+'</p>'+exHTML(c)
            : '<p class="term '+(c.d.length>26?"small":"")+'">'+termHTML(c)+'</p>'+gramTags(c)+exHTML(c))+
        '</div>'+
        '<div class="face-bot"><span class="hint">Wie gut wusstest du es?</span><span class="mono hint">'+(qi+1)+'/'+queue.length+'</span></div>'+
      '</div>'+
    '</div><div class="card-spacer"></div></div>'+
  (flipped
    ? '<div class="rate">'+
        '<button data-g="0"><span class="lab again">Nochmal</span><span class="sub">1 · heute</span></button>'+
        '<button data-g="1"><span class="lab hard">Schwer</span><span class="sub">2 · '+inDays(INTERVALS[Math.max(0,P(c.i).b-1)])+'</span></button>'+
        '<button data-g="2"><span class="lab good">Gewusst</span><span class="sub">3 · '+inDays(INTERVALS[Math.min(4,P(c.i).b+1)])+'</span></button>'+
      '</div>'
    : '<button class="btn showbtn" id="showBtn">Antwort zeigen</button>');
  sizeCard();
  const card = $("#card");
  card.addEventListener("click", e=>{ if(e.target.closest("button")) return; flip(); });
  card.addEventListener("keydown", e=>{ if(e.key==="Enter"){ e.preventDefault(); flip(); } });
  const sb = $("#showBtn"); if(sb) sb.addEventListener("click", flip);
  $("#starBtn").addEventListener("click", ()=> toggleStar(c.i));
  $$(".rate button").forEach(b=> b.addEventListener("click", ()=>{ grade(c.i, +b.dataset.g); next(); }));
}
function flip(){ flipped = !flipped; render(); }
function toggleStar(id){ if(S.star[id]) delete S.star[id]; else S.star[id] = 1; save(); render(); }

function distractors(c, n, key){
  let pool = DATA.filter(x=> x.i!==c.i && x.p===c.p && x[key] && x[key]!==c[key]);
  if(pool.length < n) pool = DATA.filter(x=> x.i!==c.i && x[key] && x[key]!==c[key]);
  const out = [], used = {};
  let guard = 0;
  while(out.length < n && guard++ < 500){
    const p = pool[Math.floor(Math.random()*pool.length)];
    if(!p || used[p.i]) continue; used[p.i]=1; out.push(p);
  }
  return out;
}
function renderChoice(c){
  const dir = dirFor(c);
  const key = dir === "de" ? "r" : "d";
  const opts = distractors(c, 3, key).map(x=>({t:x[key], ok:false}));
  opts.push({t:c[key], ok:true}); shuffle(opts);
  stage.innerHTML =
  '<div class="face" style="position:static;min-height:0;'+genStyle(c.g)+'">'+
    '<div class="face-top"><span class="eyebrow">Was passt?</span><span class="mono hint">'+(qi+1)+'/'+queue.length+'</span></div>'+
    '<div class="face-mid" style="padding-block:10px">'+
      '<p class="term '+((dir==="de"?c.d:c.r).length>26?"small":"")+'">'+(dir==="de"?termHTML(c):esc(c.r))+'</p>'+
      (dir==="de"?gramTags(c):"")+
    '</div></div>'+
  '<div class="opts" id="opts">'+opts.map((o,k)=>'<button class="opt" data-ok="'+o.ok+'">'+esc(o.t)+'</button>').join("")+'</div>'+
  '<div id="after"></div>';
  $$("#opts .opt").forEach(b=> b.addEventListener("click", ()=>{
    const ok = b.dataset.ok === "true";
    $$("#opts .opt").forEach(x=>{ x.disabled = true; if(x.dataset.ok==="true") x.classList.add("correct"); });
    if(!ok) b.classList.add("wrong");
    grade(c.i, ok ? 2 : 0);
    $("#after").innerHTML = exHTML(c)+'<button class="btn showbtn" id="nx">Weiter →</button>';
    $("#nx").addEventListener("click", next); $("#nx").focus();
    renderProgress();
  }));
}

let ai = 0;
function renderArtikel(){
  const nouns = deck().filter(c=>c.g);
  if(!nouns.length){ stage.innerHTML = '<div class="empty"><b>Keine Nomen im Deck</b>Aktiviere „Nomen“ unter Wortart.</div>'; return; }
  if(ai >= nouns.length) ai = 0;
  const c = nouns[ai];
  stage.innerHTML =
  '<div class="face" style="position:static;min-height:0;'+genStyle(c.g)+'">'+
    '<div class="face-top"><span class="eyebrow">Welcher Artikel?</span>'+
      '<span class="mono hint">'+(ai+1)+'/'+nouns.length+'</span></div>'+
    '<div class="face-mid" style="padding-block:10px">'+
      '<p class="term">'+esc(c.d.replace(/^(der|die|das)\s+/,""))+'</p>'+
      '<p class="trans" style="font-size:16px;color:var(--ink-2)">'+esc(c.r)+'</p>'+
    '</div></div>'+
  '<div class="artopts" id="arts">'+
    '<button class="opt" data-a="der">der</button>'+
    '<button class="opt" data-a="die">die</button>'+
    '<button class="opt" data-a="das">das</button></div>'+
  '<div id="after"></div>';
  $$("#arts .opt").forEach(b=> b.addEventListener("click", ()=>{
    const ok = b.dataset.a === c.g;
    $$("#arts .opt").forEach(x=>{ x.disabled = true;
      if(x.dataset.a===c.g) x.classList.add("correct"); else x.classList.add("dim"); });
    if(!ok) b.classList.add("wrong");
    grade(c.i, ok ? 2 : 0);
    $("#after").innerHTML = '<div class="verdict">'+(ok?'<span class="yes">Richtig.</span>':'<span class="no">Falsch.</span>')+
      '<span class="ans" style="color:var(--gcol)">'+termHTML(c)+'</span></div>'+
      '<button class="btn showbtn" id="nx">Weiter →</button>';
    $("#nx").addEventListener("click", ()=>{ ai++; render(); renderProgress(); });
    $("#nx").focus(); renderProgress();
  }));
}

function norm(s){
  return String(s).toLowerCase().trim()
    .replace(/ä/g,"ae").replace(/ö/g,"oe").replace(/ü/g,"ue").replace(/ß/g,"ss")
    .replace(/[.,!?;:]/g,"").replace(/\s+/g," ");
}
function renderType(c){
  stage.innerHTML =
  '<div class="face" style="position:static;min-height:0;'+genStyle(c.g)+'">'+
    '<div class="face-top"><span class="eyebrow">Auf Deutsch?</span><span class="mono hint">'+(qi+1)+'/'+queue.length+'</span></div>'+
    '<div class="face-mid" style="padding-block:10px">'+
      '<p class="term '+(c.r.length>26?"small":"")+'">'+esc(c.r)+'</p>'+
      '<div class="gram"><span class="gtag">'+(POSNAME[c.p]||c.p)+'</span>'+
        (c.g?'<span class="gtag g">Artikel optional</span>':"")+'<span class="gtag">L'+c.l+'</span></div>'+
    '</div></div>'+
  '<div class="typerow"><input id="ti" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="auf Deutsch tippen…" aria-label="Antwort"></div>'+
  '<div class="umlauts">'+["ä","ö","ü","ß","Ä","Ö","Ü"].map(u=>'<button data-u="'+u+'">'+u+'</button>').join("")+'</div>'+
  '<div id="after"></div>';
  const inp = $("#ti"); inp.focus();
  $$(".umlauts button").forEach(b=> b.addEventListener("click", ()=>{
    const a = inp.selectionStart == null ? inp.value.length : inp.selectionStart;
    const z = inp.selectionEnd == null ? a : inp.selectionEnd;
    inp.value = inp.value.slice(0,a) + b.dataset.u + inp.value.slice(z);
    inp.focus(); inp.setSelectionRange(a+1, a+1);
  }));
  let done = false;
  function check(){
    if(done) return; done = true;
    const v = norm(inp.value);
    const full = norm(c.d), bare = norm(bareDe(c));
    const ok = !!v && (v === full || v === bare || v === norm(c.d.replace(/^(der|die|das)\s+/,"")));
    inp.classList.add(ok ? "ok" : "no"); inp.disabled = true;
    grade(c.i, ok ? 2 : 0);
    $("#after").innerHTML = '<div class="verdict">'+(ok?'<span class="yes">Richtig.</span>':'<span class="no">Nicht ganz.</span>')+
      '<span class="ans" style="color:var(--gcol)">'+termHTML(c)+'</span></div>'+exHTML(c)+
      '<button class="btn showbtn" id="nx">Weiter →</button>';
    $("#nx").addEventListener("click", next); $("#nx").focus(); renderProgress();
  }
  inp.addEventListener("keydown", e=>{ if(e.key==="Enter"){ e.preventDefault(); if(done) next(); else check(); } });
}

let browseN = 60, browseQ = "", browseHide = false;
function renderBrowse(){
  const q = browseQ.toLowerCase().trim();
  const qn = norm(browseQ);
  const d = deck().filter(c=> !q || norm(c.d).indexOf(qn) >= 0 || c.d.toLowerCase().indexOf(q) >= 0 || c.r.toLowerCase().indexOf(q) >= 0);
  const rows = d.slice(0, browseN).map(c=>
    '<div class="row" style="'+genStyle(c.g)+'">'+
      '<div class="de"'+(c.g?' style="color:var(--gcol)"':"")+'>'+termHTML(c)+

      '<div class="ru">'+esc(c.r)+'</div>'+
      '<div class="tag">L'+c.l+'</div></div>').join("");
  stage.innerHTML =
    '<input class="search" id="q" placeholder="Suchen: Deutsch oder Русский…" value="'+esc(browseQ)+'" aria-label="Suchen">'+
    '<div class="quicklinks" style="margin-bottom:10px">'+
      '<button id="hideBtn">'+(browseHide?"Übersetzungen zeigen":"Übersetzungen ausblenden")+'</button>'+
      '<span class="hint mono">'+d.length+' Wörter</span></div>'+
    '<div class="list '+(browseHide?"hidden":"")+'">'+(rows || '<div class="row"><div class="ru">Nichts gefunden.</div></div>')+
      (d.length > browseN ? '<button class="more" id="moreBtn">Weitere '+Math.min(60, d.length-browseN)+' zeigen</button>' : "")+'</div>';
  const qi2 = $("#q");
  qi2.addEventListener("input", ()=>{ browseQ = qi2.value; browseN = 60; const p = qi2.selectionStart;
    renderBrowse(); const n2 = $("#q"); n2.focus(); n2.setSelectionRange(p,p); });
  $("#hideBtn").addEventListener("click", ()=>{ browseHide = !browseHide; renderBrowse(); });
  const mb = $("#moreBtn"); if(mb) mb.addEventListener("click", ()=>{ browseN += 60; renderBrowse(); });

/* ================= Grammatik ================= */
const GSUBS = [
  {k:"perfekt", label:"Perfekt", n:()=>GRAM.perfekt.length},
  {k:"vp",      label:"Verb + Präposition", n:()=>GRAM.vp.length},
  {k:"ww",      label:"Wo & Wohin", n:()=>GRAM.ww.length},
  {k:"p1",      label:"Partizip I", n:()=>GRAM.p1.length}
];
const CASENAME = {A:"Akkusativ", D:"Dativ"};
let gOrder = {}, gPos = {}, gRight = 0, gDone = 0, gAns = null;

function gList(){ return GRAM[S.gsub] || []; }
function gEnsure(){
  if(!gOrder[S.gsub] || gOrder[S.gsub].length !== gList().length){
    gOrder[S.gsub] = gList().map((_,i)=>i); shuffle(gOrder[S.gsub]); gPos[S.gsub] = 0;
  }
  if(gPos[S.gsub] == null) gPos[S.gsub] = 0;
  if(gPos[S.gsub] >= gOrder[S.gsub].length) gPos[S.gsub] = 0;
}
function gItem(){ gEnsure(); return gList()[gOrder[S.gsub][gPos[S.gsub]]]; }
function gKey(){ return "g:" + S.gsub + ":" + gOrder[S.gsub][gPos[S.gsub]]; }
function gNext(){
  gPos[S.gsub]++;
  if(gPos[S.gsub] >= gOrder[S.gsub].length){ shuffle(gOrder[S.gsub]); gPos[S.gsub] = 0; }
  gAns = null; renderGram();
}
function gScore(ok){
  gDone++; if(ok) gRight++;
  grade(gKey(), ok ? 2 : 0);
}
function gShell(inner){
  gEnsure();
  const mastered = gList().reduce((n,_,i)=> n + (P("g:"+S.gsub+":"+i).b === 4 ? 1 : 0), 0);
  return '<div class="subnav" role="tablist">'+
      GSUBS.map(s=>'<button role="tab" data-gsub="'+s.k+'" aria-selected="'+(s.k===S.gsub)+'">'+
        s.label+'</button>').join("")+'</div>'+
    inner+
    '<div class="gscore" style="margin-top:16px">'+
      '<span><b>'+(gPos[S.gsub]+1)+'</b> / '+gList().length+'</span>'+
      '<span>richtig <b>'+gRight+'</b> von <b>'+gDone+'</b></span>'+
      '<span>gelernt <b>'+mastered+'</b></span>'+
    '</div>';
}
function gCard(body){ return '<div class="face" style="position:static;min-height:0">'+body+'</div>'; }
function gWhy(ok, head, rule, ru){
  return '<div class="why">'+
    '<span>'+(ok?'<b style="color:var(--good)">Richtig.</b> ':'<b style="color:var(--bad)">Noch nicht.</b> ')+head+'</span>'+
    (rule?'<span class="rule">'+rule+'</span>':"")+
    (ru?'<span>'+esc(ru)+'</span>':"")+
  '</div><button class="btn showbtn" id="gnx">Weiter →</button>';
}
function gBindNext(){
  const b = $("#gnx"); if(b){ b.addEventListener("click", gNext); b.focus(); }
}
function gBindSub(){
  $$(".subnav button").forEach(b=> b.addEventListener("click", ()=>{
    S.gsub = b.dataset.gsub; save(); gAns = null; renderGram();
  }));
}

function renderGram(){
  if(!S.gsub || !GSUBS.some(s=>s.k===S.gsub)) S.gsub = "perfekt";
  if(S.gsub === "perfekt") gPerfekt();
  else if(S.gsub === "p1") gPartizip1();
  else if(S.gsub === "vp") gVerbPrep();
  else gWoWohin();
  gBindSub();
}

/* --- Perfekt: pick the auxiliary, type the Partizip II --- */
function gPerfekt(){
  const it = gItem();              // [inf, aux, p2, ru, ex, cat]
  const done = !!gAns;
  const chosen = gAns ? gAns.aux : null;
  const body =
    '<div class="face-top"><span class="eyebrow">Perfekt bilden</span>'+
      '<span class="gtag">'+esc(it[5])+'</span></div>'+
    '<div class="gprompt">'+
      '<p class="gsent" style="font-size:clamp(24px,5.4vw,34px)">'+esc(it[0])+'</p>'+
      '<p class="gru">'+esc(it[3])+'</p>'+
    '</div>'+
    '<div class="steps">'+
      '<div class="steprow"><span class="lbl">Hilfsverb</span>'+
        ["hat","ist"].map(a=>{
          let cls = "pill";
          if(done){ if(a === it[1]) cls += " correct"; else if(a === chosen) cls += " wrong"; else cls += " dim"; }
          else if(a === chosen) cls += " chosen";
          return '<button class="'+cls+'" data-aux="'+a+'"'+(done?" disabled":"")+'>'+a+'</button>';
        }).join("")+
      '</div>'+
      '<div class="steprow"><span class="lbl">Partizip II</span>'+
        '<input id="gi" class="search" style="margin:0;flex:1;min-width:11ch;font-family:var(--disp);font-weight:600"'+
        ' autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="ge…"'+
        ' aria-label="Partizip II" value="'+(gAns?esc(gAns.txt):"")+'"'+(done?" disabled":"")+'>'+
        (done?"":'<button class="btn" id="gcheck">Prüfen</button>')+
      '</div>'+
    '</div>';
  stage.innerHTML = gShell(gCard(body) + (done
    ? gWhy(gAns.ok, '<b>'+esc(it[1]+" "+it[2])+'</b>', esc(it[4]), null)
    : ""));
  if(done){ gBindNext(); return; }
  $$("[data-aux]").forEach(b=> b.addEventListener("click", ()=>{
    $$("[data-aux]").forEach(x=> x.classList.toggle("chosen", x === b));
    $("#gi").focus();
  }));
  const inp = $("#gi");
  function check(){
    const sel = $$("[data-aux]").find(x=> x.classList.contains("chosen"));
    if(!sel){ $$("[data-aux]")[0].focus(); return; }
    const txt = inp.value;
    const ok = sel.dataset.aux === it[1] && norm(txt) === norm(it[2]);
    gAns = {aux:sel.dataset.aux, txt:txt, ok:ok};
    gScore(ok); renderGram(); renderProgress();
  }
  const cb = $("#gcheck"); if(cb) cb.addEventListener("click", check);
  inp.addEventListener("keydown", e=>{ if(e.key === "Enter"){ e.preventDefault(); check(); } });
  inp.focus();
}

/* --- Partizip I: infinitive + d --- */
function gPartizip1(){
  const it = gItem();              // [inf, p1, ru, phrase, phraseRu]
  const done = !!gAns;
  const body =
    '<div class="face-top"><span class="eyebrow">Partizip I bilden</span>'+
      '<span class="gtag">Infinitiv + d</span></div>'+
    '<div class="gprompt">'+
      '<p class="gsent" style="font-size:clamp(24px,5.4vw,34px)">'+esc(it[0])+'</p>'+
      '<p class="gru">'+esc(it[2])+'</p>'+
    '</div>'+
    '<div class="steps"><div class="steprow">'+
      '<input id="gi" class="search" style="margin:0;flex:1;min-width:11ch;font-family:var(--disp);font-weight:600"'+
      ' autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="…end"'+
      ' aria-label="Partizip I" value="'+(gAns?esc(gAns.txt):"")+'"'+(done?" disabled":"")+'>'+
      (done?"":'<button class="btn" id="gcheck">Prüfen</button>')+
    '</div></div>';
  stage.innerHTML = gShell(gCard(body) + (done
    ? gWhy(gAns.ok, '<b>'+esc(it[1])+'</b> — als Adjektiv: <b>'+esc(it[3])+'</b>',
        "Vor einem Nomen bekommt das Partizip I eine Adjektivendung.", it[4])
    : ""));
  if(done){ gBindNext(); return; }
  const inp = $("#gi");
  function check(){
    const ok = norm(inp.value) === norm(it[1]);
    gAns = {txt:inp.value, ok:ok}; gScore(ok); renderGram(); renderProgress();
  }
  $("#gcheck").addEventListener("click", check);
  inp.addEventListener("keydown", e=>{ if(e.key === "Enter"){ e.preventDefault(); check(); } });
  inp.focus();
}

/* --- Verb + Präposition: pick preposition, then case --- */
let gPrepOpts = null, gPrepPick = null;
function gVerbPrep(){
  const it = gItem();              // [verb, prep, case, ru, ex, exRu]
  const done = !!gAns;
  if(!gPrepOpts || gPrepOpts.key !== gKey()){
    const all = [];
    GRAM.vp.forEach(r=>{ if(r[1] !== it[1] && all.indexOf(r[1]) < 0) all.push(r[1]); });
    shuffle(all);
    const opts = all.slice(0,3).concat([it[1]]); shuffle(opts);
    gPrepOpts = {key:gKey(), opts:opts};
    gPrepPick = null;
  }
  const body =
    '<div class="face-top"><span class="eyebrow">Welche Präposition?</span>'+
      '<span class="gtag">festes Verb + Präposition</span></div>'+
    '<div class="gprompt">'+
      '<p class="gsent" style="font-size:clamp(22px,4.8vw,30px)">'+esc(it[0])+' <span class="gap">?</span></p>'+
      '<p class="gru">'+esc(it[3])+'</p>'+
    '</div>'+
    '<div class="steps">'+
      '<div class="steprow"><span class="lbl">Präposition</span>'+
        gPrepOpts.opts.map(p=>{
          let cls = "pill";
          if(done){ if(p === it[1]) cls += " correct"; else if(p === gAns.prep) cls += " wrong"; else cls += " dim"; }
          else if(p === gPrepPick) cls += " chosen";
          return '<button class="'+cls+'" data-prep="'+esc(p)+'"'+(done?" disabled":"")+'>'+esc(p)+'</button>';
        }).join("")+
      '</div>'+
      '<div class="steprow"><span class="lbl">Kasus</span>'+
        ["D","A"].map(c=>{
          let cls = "pill";
          if(done){ if(c === it[2]) cls += " correct"; else if(c === gAns.kasus) cls += " wrong"; else cls += " dim"; }
          return '<button class="'+cls+'" data-kasus="'+c+'"'+(done || !gPrepPick ?" disabled":"")+'>'+CASENAME[c]+'</button>';
        }).join("")+
      '</div>'+
    '</div>';
  stage.innerHTML = gShell(gCard(body) + (done
    ? gWhy(gAns.ok, '<b>'+esc(it[0]+" "+it[1]+" + "+CASENAME[it[2]])+'</b> — '+esc(it[4]), null, it[5])
    : ""));
  if(done){ gBindNext(); return; }
  $$("[data-prep]").forEach(b=> b.addEventListener("click", ()=>{ gPrepPick = b.dataset.prep; renderGram(); }));
  $$("[data-kasus]").forEach(b=> b.addEventListener("click", ()=>{
    const ok = gPrepPick === it[1] && b.dataset.kasus === it[2];
    gAns = {prep:gPrepPick, kasus:b.dataset.kasus, ok:ok};
    gScore(ok); renderGram(); renderProgress();
  }));
}

/* --- Wechselpräpositionen: Dativ or Akkusativ --- */
let gWwOpts = null;
function gWoWohin(){
  const it = gItem();              // [start, ok, wrong, end, wo|wohin, why, ru]
  const done = !!gAns;
  if(!gWwOpts || gWwOpts.key !== gKey()){
    const o = [it[1], it[2]]; shuffle(o); gWwOpts = {key:gKey(), opts:o};
  }
  const gap = done
    ? '<span class="gap filled '+(gAns.ok?"ok":"bad")+'">'+esc(gAns.pick)+'</span>'
    : '<span class="gap">?</span>';
  const body =
    '<div class="face-top"><span class="eyebrow">Dativ oder Akkusativ?</span>'+
      '<span class="gtag">'+(it[4] === "wo" ? "wo?" : "wohin?")+'</span></div>'+
    '<div class="gprompt">'+
      '<p class="gsent">'+esc(it[0])+gap+esc(it[3])+'</p>'+
      '<p class="gru">'+esc(it[6])+'</p>'+
    '</div>'+
    '<div class="steps"><div class="steprow" style="margin-top:2px">'+
      gWwOpts.opts.map(o=>{
        let cls = "pill";
        if(done){ if(o === it[1]) cls += " correct"; else if(o === gAns.pick) cls += " wrong"; else cls += " dim"; }
        return '<button class="'+cls+'" data-ww="'+esc(o)+'"'+(done?" disabled":"")+'>'+esc(o)+'</button>';
      }).join("")+
    '</div></div>';
  stage.innerHTML = gShell(gCard(body) + (done
    ? gWhy(gAns.ok, '<b>'+esc(it[0]+it[1]+it[3])+'</b>', esc(it[5]), null)
    : ""));
  if(done){ gBindNext(); return; }
  $$("[data-ww]").forEach(b=> b.addEventListener("click", ()=>{
    const ok = b.dataset.ww === it[1];
    gAns = {pick:b.dataset.ww, ok:ok}; gScore(ok); renderGram(); renderProgress();
  }));
}

  Object.keys(d.prog).forEach(k=>{
    const inc = d.prog[k], have = S.prog[k];

    if(!have || (inc.seen||0) > (have.seen||0)){ S.prog[k] = inc; n++; }
  });

  $("#xferMsg").textContent = n + " Wörter übernommen.";
});

document.addEventListener("keydown", e=>{
  if(e.target && e.target.matches && e.target.matches("input, textarea")) return;
  if(e.metaKey || e.ctrlKey || e.altKey) return;
  const c = cur();
  if(S.mode === "cards" && c){
    if(e.code === "Space"){ e.preventDefault(); flip(); return; }
    if(flipped && "123".indexOf(e.key) >= 0){ e.preventDefault(); grade(c.i, +e.key - 1); next(); return; }
  }
  if(S.mode === "gram"){
    const gnx = $("#gnx");
    if(e.key === "Enter" && gnx){ e.preventDefault(); gnx.click(); }
    return;
  }
  if(S.mode === "choice" || S.mode === "artikel"){
    const nx = $("#nx");
    if(e.key === "Enter" && nx){ e.preventDefault(); nx.click(); return; }
    const opts = $$("#opts .opt, #arts .opt");
    if(opts.length && "1234".indexOf(e.key) >= 0 && !opts[0].disabled){ e.preventDefault();
      if(opts[+e.key-1]) opts[+e.key-1].click(); return; }
  }
  if(e.key.toLowerCase() === "s" && c && S.mode !== "browse"){ e.preventDefault(); toggleStar(c.i); }
  if(e.key === "ArrowRight" && S.mode !== "browse"){ e.preventDefault(); next(); }
});
window.addEventListener("resize", ()=>{ if(S.mode==="cards") sizeCard(); });

renderChips(); buildQueue(); render(); renderProgress();
})();
</script>
